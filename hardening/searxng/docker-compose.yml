# Hardened SearXNG stack. Pair with nginx.conf (TLS termination with a
# Cloudflare Origin CA cert + Authenticated Origin Pulls) on the host.
#
#   cp .env.example .env && sed -i "s/CHANGE_ME/$(openssl rand -hex 32)/" .env
#   docker compose up -d
#
# Nothing here is published on a public interface: searxng listens on
# 127.0.0.1:8080 only, valkey is reachable only inside the compose network.
services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: searxng-valkey
    command: valkey-server --save 30 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - valkey-data:/data
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    depends_on: [valkey]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
      - ./limiter.toml:/etc/searxng/limiter.toml:ro
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:?set in .env}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set in .env}
      SEARXNG_REDIS_URL: redis://valkey:6379/0
      SEARXNG_LIMITER: "true"
      SEARXNG_PUBLIC_INSTANCE: ${SEARXNG_PUBLIC_INSTANCE:-false}
      SEARXNG_IMAGE_PROXY: "true"
      SEARXNG_STATIC_USE_HASH: "true"
      SEARXNG_DEBUG: "false"
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 512
    logging: *log

volumes:
  valkey-data:
