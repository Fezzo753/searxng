# /etc/nginx/sites-available/searxng  ->  ln -s into sites-enabled
#
# Origin TLS: Cloudflare Origin CA certificate (dashboard: SSL/TLS > Origin
# Server > Create Certificate; valid 15 years; only trusted by Cloudflare,
# which is the only client that may talk to this origin).
#   /etc/nginx/ssl/origin.pem  /etc/nginx/ssl/origin.key (0600)
# Authenticated Origin Pulls CA (so only Cloudflare, not just "someone who knows
# the IP", is accepted):
#   curl -fsSo /etc/nginx/ssl/cloudflare-origin-pull-ca.pem \
#     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# Real client IP list: generated by cloudflare-allowlist.sh --nginx into
#   /etc/nginx/conf.d/cloudflare-real-ip.conf  (set_real_ip_from ...; real_ip_header CF-Connecting-IP;)

# anything not matching a configured server_name gets a dropped connection
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    return 444;
}

limit_req_zone $binary_remote_addr zone=searx_search:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=searx_general:10m rate=20r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name search.example.com;

    ssl_certificate     /etc/nginx/ssl/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Authenticated Origin Pulls: require Cloudflare's client certificate.
    # Enable "Authenticated Origin Pulls" in the zone first (harden-zone.sh does).
    ssl_client_certificate /etc/nginx/ssl/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Headers Cloudflare does not add for you (HSTS is added at the edge)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; upgrade-insecure-requests" always;

    access_log /var/log/nginx/searxng.access.log;   # consider 'off' for a privacy instance
    error_log  /var/log/nginx/searxng.error.log warn;

    location = /search {
        limit_req zone=searx_search burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/searxng-proxy.conf;
    }
    location ~ ^/(stats|metrics|config)$ {   # internal diagnostics
        allow 127.0.0.1; deny all;
        include /etc/nginx/snippets/searxng-proxy.conf;
    }
    location / {
        limit_req zone=searx_general burst=40 nodelay;
        include /etc/nginx/snippets/searxng-proxy.conf;
    }
}
